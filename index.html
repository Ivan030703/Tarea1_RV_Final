<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tarea VR - Interactiva</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Cursor para poder hacer clic con el mouse -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .boton-click"></a-entity>

      <!-- Fondo (Environment) -->
      <a-entity id="escenario" environment="preset: contact"></a-entity>

      <!-- LAS 3 FIGURAS (Solo el Dodecaedro empieza visible) -->
      <a-entity id="dodeca" position="0 2.5 -2" geometry="primitive: dodecahedron" material="color: #ff4b5c" scale="0.4 0.4 0.4" visible="true"></a-entity>
      <a-entity id="esfera" position="0 2.5 -2" geometry="primitive: sphere" material="color: #d400ff" scale="0.5 0.5 0.5" visible="false"></a-entity>
      <a-entity id="toro" position="0 2.5 -2" geometry="primitive: torus; radius: 0.4; radius-tubular: 0.05" material="color: #4004e7" scale="0.6 0.6 0.6" visible="false"></a-entity>

      <!-- EL TABLERO -->
      <a-entity id="menu" position="0 1.2 -1" rotation="-30 0 0">
        <a-box width="1.2" height="0.6" depth="0.05" color="#222"></a-box>
        
        <!-- Botón Sphere -->
        <a-box id="btn-esfera" class="boton-click" position="-0.35 0 0.03" width="0.25" height="0.15" depth="0.02" color="#d400ff">
            <a-text value="SPHERE" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>

        <!-- Botón Dodecah -->
        <a-box id="btn-dodeca" class="boton-click" position="0 0 0.03" width="0.25" height="0.15" depth="0.02" color="#ff4b5c">
            <a-text value="DODEC" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>

        <!-- Botón Torus -->
        <a-box id="btn-toro" class="boton-click" position="0.35 0 0.03" width="0.25" height="0.15" depth="0.02" color="#4004e7">
            <a-text value="TORUS" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>

        <!-- Botón Dark Mode -->
        <a-box id="btn-dark" class="boton-click" position="0 -0.2 0.03" width="0.6" height="0.1" depth="0.02" color="#444">
            <a-text value="DARK MODE" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>
      </a-entity>

      <a-camera position="0 1.6 2"></a-camera>
    </a-scene>

    <script>
      // Lógica para cambiar las figuras
      const figDodeca = document.querySelector('#dodeca');
      const figEsfera = document.querySelector('#esfera');
      const figToro = document.querySelector('#toro');
      const escenario = document.querySelector('#escenario');

      function ocultarTodo() {
        figDodeca.setAttribute('visible', 'false');
        figEsfera.setAttribute('visible', 'false');
        figToro.setAttribute('visible', 'false');
      }

      document.querySelector('#btn-esfera').addEventListener('click', () => {
        ocultarTodo();
        figEsfera.setAttribute('visible', 'true');
      });

      document.querySelector('#btn-dodeca').addEventListener('click', () => {
        ocultarTodo();
        figDodeca.setAttribute('visible', 'true');
      });

      document.querySelector('#btn-toro').addEventListener('click', () => {
        ocultarTodo();
        figToro.setAttribute('visible', 'true');
      });

      // Lógica para el Dark Mode
      let esOscuro = false;
      document.querySelector('#btn-dark').addEventListener('click', () => {
        if (!esOscuro) {
          escenario.setAttribute('environment', 'preset: starry');
          esOscuro = true;
        } else {
          escenario.setAttribute('environment', 'preset: contact');
          esOscuro = false;
        }
      });
    </script>
  </body>
</html>
