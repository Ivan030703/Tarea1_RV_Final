<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tarea VR - Corregida</title>
    <!-- Usamos la versión 1.5.0 que es muy estable para evitar que se trabe al cargar -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Cursor para hacer clic con el mouse -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactuable"></a-entity>

      <!-- Escenario inicial: Preset Contact para tener la cuadrícula gris -->
      <a-entity id="ambiente" environment="preset: contact; dressingAmount: 0; grid: cross"></a-entity>

      <!-- FIGURAS (En la posición superior centro) -->
      <a-entity id="fig-dodeca" position="0 3 -3" geometry="primitive: dodecahedron" material="color: #ff4b5c" scale="0.4 0.4 0.4" visible="true"></a-entity>
      <a-entity id="fig-esfera" position="0 3 -3" geometry="primitive: sphere" material="color: #d400ff" scale="0.5 0.5 0.5" visible="false"></a-entity>
      <a-entity id="fig-toro" position="0 3.2 -3" geometry="primitive: torus; radius: 0.4; radius-tubular: 0.08" material="color: #0b0b8c" scale="0.7 0.7 0.7" visible="false"></a-entity>

      <!-- TABLERO GRIS (Igual a tu imagen) -->
      <a-entity id="menu" position="0 1.4 -1" rotation="-40 0 0">
        <a-box width="1.2" height="0.8" depth="0.05" color="#999"></a-box>
        
        <!-- Adorno del Slider (Barra blanca y cilindro azul) -->
        <a-box position="0 0.25 0.03" width="0.8" height="0.015" depth="0.02" color="white"></a-box>
        <a-cylinder position="0 0.25 0.04" radius="0.06" height="0.12" rotation="90 0 0" color="#3b5998"></a-cylinder>

        <!-- Botón SPHERE -->
        <a-box id="btn-esfera" class="interactuable" position="-0.35 0.05 0.03" width="0.25" height="0.15" depth="0.04" color="#3b5998">
            <a-text value="sphere" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>

        <!-- Botón DODECA (Inicia verde) -->
        <a-box id="btn-dodeca" class="interactuable" position="0 0.05 0.03" width="0.25" height="0.15" depth="0.04" color="#248f24">
            <a-text value="dodeca" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>

        <!-- Botón TORUS -->
        <a-box id="btn-toro" class="interactuable" position="0.35 0.05 0.03" width="0.25" height="0.15" depth="0.04" color="#3b5998">
            <a-text value="torus" align="center" position="0 0 0.06" scale="0.3 0.3 0.3"></a-text>
        </a-box>

        <!-- Botón circular azul grande abajo -->
        <a-cylinder id="btn-dark" class="interactuable" position="0 -0.25 0.03" radius="0.16" height="0.05" rotation="90 0 0" color="#3b5998"></a-cylinder>
      </a-entity>

      <a-camera position="0 1.6 1.5"></a-camera>
    </a-scene>

    <script>
      // Esperamos a que la escena cargue completamente para ejecutar el código
      document.querySelector('a-scene').addEventListener('loaded', function () {
        const d = document.querySelector('#fig-dodeca');
        const e = document.querySelector('#fig-esfera');
        const t = document.querySelector('#fig-toro');
        const amb = document.querySelector('#ambiente');
        
        const bD = document.querySelector('#btn-dodeca');
        const bE = document.querySelector('#btn-esfera');
        const bT = document.querySelector('#btn-toro');

        const AZUL = "#3b5998";
        const VERDE = "#248f24";

        function reset() {
          d.setAttribute('visible', false);
          e.setAttribute('visible', false);
          t.setAttribute('visible', false);
          bD.setAttribute('color', AZUL);
          bE.setAttribute('color', AZUL);
          bT.setAttribute('color', AZUL);
        }

        document.querySelector('#btn-esfera').addEventListener('click', () => { reset(); e.setAttribute('visible', true); bE.setAttribute('color', VERDE); });
        document.querySelector('#btn-dodeca').addEventListener('click', () => { reset(); d.setAttribute('visible', true); bD.setAttribute('color', VERDE); });
        document.querySelector('#btn-toro').addEventListener('click', () => { reset(); t.setAttribute('visible', true); bT.setAttribute('color', VERDE); });

        let dark = false;
        document.querySelector('#btn-dark').addEventListener('click', () => {
          dark = !dark;
          amb.setAttribute('environment', dark ? 'preset: tron' : 'preset: contact; dressingAmount: 0');
        });
      });
    </script>
  </body>
</html>
